name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify frozen App Store URLs survived the build
        run: |
          set -e
          for p in Atlas/index.html Atlas/privacy.html Atlas/terms.html \
                   Kura/privacy.html Kura/support.html \
                   Memorandum/privacy.html Memorandum/support.html \
                   explorare/privacy.html explorare/support.html \
                   kagiru/privacy_policy.html kagiru/terms_and_conditions.html \
                   light_and_year/privacy.html light_and_year/support.html \
                   CNAME ads.txt app-ads.txt; do
            test -f "dist/$p" || { echo "::error::missing dist/$p"; exit 1; }
            diff -q "public/$p" "dist/$p" >/dev/null || { echo "::error::dist/$p differs from public/$p"; exit 1; }
          done
          echo "all frozen paths ok"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
