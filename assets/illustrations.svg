<!-- Premium SVG Illustrations in Gouache/Crayola Style -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- Texture/Grain Pattern -->
  <defs>
    <filter id="texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" />
    </filter>

    <filter id="paintTexture">
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" />
      <feDisplacementMap in="SourceGraphic" scale="5" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Memory Card Illustration -->
  <symbol id="memory-card" viewBox="0 0 200 200">
    <g filter="url(#paintTexture)">
      <!-- Background card -->
      <rect x="40" y="30" width="120" height="140" rx="12"
            fill="#D97845" opacity="0.9"/>

      <!-- Question mark -->
      <circle cx="100" cy="85" r="15" fill="#F5F2EA" opacity="0.8"/>
      <path d="M 100 70 Q 110 70, 110 80 Q 110 90, 100 95"
            stroke="#2C2820" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="105" r="3" fill="#2C2820"/>

      <!-- Decorative stars -->
      <path d="M 65 50 L 67 56 L 73 56 L 68 60 L 70 66 L 65 62 L 60 66 L 62 60 L 57 56 L 63 56 Z"
            fill="#E89560" opacity="0.7"/>
      <path d="M 135 145 L 137 151 L 143 151 L 138 155 L 140 161 L 135 157 L 130 161 L 132 155 L 127 151 L 133 151 Z"
            fill="#E89560" opacity="0.7"/>
    </g>
  </symbol>

  <!-- Light Bulb / Year Illustration -->
  <symbol id="light-bulb" viewBox="0 0 200 200">
    <g filter="url(#paintTexture)">
      <!-- Bulb glow -->
      <circle cx="100" cy="80" r="45" fill="#E89560" opacity="0.3" filter="url(#softGlow)"/>

      <!-- Bulb body -->
      <ellipse cx="100" cy="80" rx="35" ry="40" fill="#7B9CAF" opacity="0.9"/>

      <!-- Bulb base -->
      <rect x="85" y="115" width="30" height="20" rx="3" fill="#5A544C" opacity="0.8"/>
      <line x1="88" y1="120" x2="112" y2="120" stroke="#F5F2EA" stroke-width="2" opacity="0.5"/>
      <line x1="88" y1="125" x2="112" y2="125" stroke="#F5F2EA" stroke-width="2" opacity="0.5"/>
      <line x1="88" y1="130" x2="112" y2="130" stroke="#F5F2EA" stroke-width="2" opacity="0.5"/>

      <!-- Light rays -->
      <path d="M 100 35 L 105 20 L 95 20 Z" fill="#D97845" opacity="0.6"/>
      <path d="M 145 60 L 160 55 L 155 65 Z" fill="#D97845" opacity="0.6"/>
      <path d="M 145 100 L 160 105 L 155 95 Z" fill="#D97845" opacity="0.6"/>
      <path d="M 55 60 L 40 55 L 45 65 Z" fill="#D97845" opacity="0.6"/>
      <path d="M 55 100 L 40 105 L 45 95 Z" fill="#D97845" opacity="0.6"/>
    </g>
  </symbol>

  <!-- Restaurant / Fork & Knife Illustration -->
  <symbol id="restaurant" viewBox="0 0 200 200">
    <g filter="url(#paintTexture)">
      <!-- Plate -->
      <ellipse cx="100" cy="110" rx="60" ry="50" fill="#A8C5D8" opacity="0.8"/>
      <ellipse cx="100" cy="110" rx="50" ry="40" fill="#F5F2EA" opacity="0.9"/>

      <!-- Fork -->
      <rect x="70" y="60" width="4" height="80" rx="2" fill="#5A544C" opacity="0.9"/>
      <rect x="64" y="60" width="4" height="35" rx="2" fill="#5A544C" opacity="0.9"/>
      <rect x="76" y="60" width="4" height="35" rx="2" fill="#5A544C" opacity="0.9"/>

      <!-- Knife -->
      <rect x="124" y="60" width="4" height="80" rx="2" fill="#5A544C" opacity="0.9"/>
      <path d="M 122 60 L 130 60 L 128 45 L 124 45 Z" fill="#78736B" opacity="0.9"/>

      <!-- Decorative garnish -->
      <circle cx="95" cy="105" r="8" fill="#D97845" opacity="0.7"/>
      <circle cx="105" cy="110" r="6" fill="#E89560" opacity="0.7"/>
      <ellipse cx="100" cy="115" rx="4" ry="3" fill="#7B9CAF" opacity="0.6"/>
    </g>
  </symbol>

  <!-- Map / Atlas Illustration -->
  <symbol id="atlas-map" viewBox="0 0 200 200">
    <g filter="url(#paintTexture)">
      <!-- Map background -->
      <rect x="30" y="40" width="140" height="120" rx="8"
            fill="#A8C5D8" opacity="0.3"/>

      <!-- Folded map effect -->
      <path d="M 90 40 L 90 160" stroke="#7B9CAF" stroke-width="2" opacity="0.5"/>
      <path d="M 110 40 L 110 160" stroke="#7B9CAF" stroke-width="2" opacity="0.5"/>

      <!-- Landmass shapes -->
      <path d="M 50 70 Q 60 65, 75 70 Q 85 75, 80 85 Q 75 95, 60 90 Q 50 85, 50 70 Z"
            fill="#D97845" opacity="0.6"/>
      <path d="M 110 90 Q 125 85, 140 95 Q 150 105, 145 120 Q 135 130, 120 125 Q 110 115, 110 90 Z"
            fill="#E89560" opacity="0.6"/>
      <path d="M 90 115 Q 100 110, 110 120 Q 105 130, 95 125 Q 88 120, 90 115 Z"
            fill="#78736B" opacity="0.5"/>

      <!-- Location pin -->
      <path d="M 100 55 Q 110 55, 110 65 Q 110 75, 100 90 Q 90 75, 90 65 Q 90 55, 100 55 Z"
            fill="#D97845" opacity="0.9"/>
      <circle cx="100" cy="65" r="5" fill="#F5F2EA" opacity="0.9"/>

      <!-- Compass rose -->
      <circle cx="150" cy="55" r="12" stroke="#5A544C" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 150 45 L 150 65 M 140 55 L 160 55" stroke="#5A544C" stroke-width="2" opacity="0.6"/>
      <path d="M 150 45 L 155 55 L 150 52 L 145 55 Z" fill="#D97845" opacity="0.7"/>
    </g>
  </symbol>

  <!-- Abstract Shapes for Decoration -->
  <symbol id="abstract-shape-1" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" fill="#D97845" opacity="0.15" filter="url(#texture)"/>
  </symbol>

  <symbol id="abstract-shape-2" viewBox="0 0 100 100">
    <rect x="15" y="15" width="70" height="70" rx="20"
          fill="#7B9CAF" opacity="0.12" filter="url(#texture)"/>
  </symbol>

  <symbol id="abstract-shape-3" viewBox="0 0 100 100">
    <path d="M 50 10 L 90 90 L 10 90 Z" fill="#E89560" opacity="0.1" filter="url(#texture)"/>
  </symbol>

  <!-- Stars for decoration -->
  <symbol id="star" viewBox="0 0 24 24">
    <path d="M 12 2 L 14 9 L 21 9 L 15 14 L 17 21 L 12 17 L 7 21 L 9 14 L 3 9 L 10 9 Z"
          fill="currentColor" filter="url(#texture)"/>
  </symbol>

  <!-- Sparkle -->
  <symbol id="sparkle" viewBox="0 0 24 24">
    <path d="M 12 0 L 13 11 L 24 12 L 13 13 L 12 24 L 11 13 L 0 12 L 11 11 Z"
          fill="currentColor" opacity="0.8"/>
  </symbol>

</svg>
